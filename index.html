<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A satellite globe overlaid with old maps, photos, drawings, newspapers, events and strange accounts from public archives. Every city becomes a museum you can walk through in time.">
<title>Palimpsest · the Earth, written over</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Spline+Sans+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map" aria-label="Map"></div>
<div id="veil" aria-hidden="true"></div>

<header id="hud">
  <button id="brand" type="button" data-act="about" aria-label="About Palimpsest">
    <span class="w">PALIMPSEST</span>
    <span class="coords" id="coords">--</span>
  </button>
  <div class="tools">
    <button class="ic" type="button" data-act="search" aria-label="Find a place"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
    <button class="ic museum" type="button" data-act="museum" aria-label="Enter the museum of this place"><svg viewBox="0 0 24 24"><path d="M3 9 12 3l9 6M5 9v10M9.5 9v10M14.5 9v10M19 9v10M3 21h18"/></svg></button>
    <button class="ic" type="button" data-act="casefile" aria-label="Case file"><svg viewBox="0 0 24 24"><path d="M4 6h6l2 2h8v11H4z"/><path d="M8 13h8M8 16h5"/></svg><b id="savedCount"></b></button>
  </div>
</header>

<div id="scan" aria-live="polite"><i></i><span id="scanText"></span></div>

<div id="side">
  <button class="ic sm" type="button" data-act="aged" id="agedBtn" aria-pressed="true" aria-label="Aged film look" title="Aged look"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="fill"/></svg></button>
  <button class="ic sm" type="button" data-act="labels" id="labelsBtn" aria-pressed="true" aria-label="Place names" title="Place names"><svg viewBox="0 0 24 24"><path d="M5 18 10 6l5 12M7 14h6M16 18v-7m0 3.5a2.5 2.5 0 1 0 5 0 2.5 2.5 0 1 0-5 0"/></svg></button>
  <button class="ic sm" type="button" data-act="globe" aria-label="Back to the globe" title="Whole Earth"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.5 2.6 2.5 13.4 0 16M12 4c-2.5 2.6-2.5 13.4 0 16"/></svg></button>
</div>

<div id="drape" hidden></div>

<section id="dock" aria-label="Time and layers">
  <button id="dockGrip" type="button" data-act="dock" aria-label="Show or hide the time dial"><i></i></button>
  <div class="era">
    <div class="read"><b id="yFrom">--</b><span class="dash"></span><b id="yTo">--</b></div>
    <button class="undated" type="button" data-act="undated" id="undatedBtn" aria-pressed="true">+ undated</button>
  </div>
  <div class="dial" id="dial">
    <div class="ticks" id="ticks"></div>
    <div class="fill" id="dialFill"></div>
    <input type="range" id="rFrom" min="0" max="1000" step="1" aria-label="From year">
    <input type="range" id="rTo" min="0" max="1000" step="1" aria-label="To year">
  </div>
  <div class="presets" id="presets"></div>
  <div class="layers" id="chips"></div>
</section>

<div id="panel" role="dialog" aria-modal="true" hidden></div>
<div id="sheetBg" data-act="sheetclose" hidden></div>
<div id="sheet" role="dialog" aria-modal="true" hidden><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast" role="status"></div>

<script src="lib/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
